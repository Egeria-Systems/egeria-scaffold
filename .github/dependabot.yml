# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Generated fixtures are immutable recipe evidence, regenerated by the builder.
    exclude-paths:
      - "fixtures/generated/**"
    ignore:
      # The accepted Next proof remains on ESLint 9 until its plugin graph supports ESLint 10.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
  # Security updates match manifest directories separately from exclude-paths.
  # Preserve snapshot integrity; dependency fixes belong in recipes and regeneration.
  - package-ecosystem: "npm"
    directories:
      - "/fixtures/generated/*"
      - "/fixtures/generated/*/apps/web"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      action-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
