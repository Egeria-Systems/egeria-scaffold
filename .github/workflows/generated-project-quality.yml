name: Generated project quality

on:
  pull_request:
    paths:
      - .github/workflows/generated-project-quality.yml
      - .gitattributes
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/cli/**
      - packages/builder-core/**
      - packages/observability/**
      - packages/standards/**
      - fixtures/generated/**
      - scripts/verify-generated-skeletons.mjs
      - tests/generated-fixtures/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/generated-project-quality.yml
      - .gitattributes
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/cli/**
      - packages/builder-core/**
      - packages/observability/**
      - packages/standards/**
      - fixtures/generated/**
      - scripts/verify-generated-skeletons.mjs
      - tests/generated-fixtures/**

permissions:
  contents: read

concurrency:
  group: generated-project-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-projects:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production generator
        run: pnpm run build:builder

      - name: Test generated fixture contracts and determinism
        run: pnpm run test:generated-fixtures

      - name: Verify retained generated projects
        run: pnpm run verify:generated-skeletons
