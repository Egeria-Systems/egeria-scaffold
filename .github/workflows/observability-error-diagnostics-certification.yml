name: Observability error diagnostics certification

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact main revision approved for certification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-deploy
  cancel-in-progress: false
  queue: max

jobs:
  verify-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: test-deploy
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Verify approved revision and subject
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          node scripts/verify-approved-revision.mjs
          git merge-base --is-ancestor 393225988aaed173e21dc547e69ff5b03305cf93 "$GITHUB_SHA"
          git merge-base --is-ancestor d543de78d8e1c238a499aeba5e315f4db724dd1b "$GITHUB_SHA"

      - name: Install builder dependencies
        run: pnpm install --frozen-lockfile

      - name: Check capability admission
        run: pnpm run check:capability-certification

      - name: Build builder packages
        run: pnpm run build:builder

      - name: Verify fresh local scaffold
        run: |
          umask 077
          node scripts/certify-observability-error-diagnostics.mjs --revision "$GITHUB_SHA" > "$RUNNER_TEMP/observability-error-diagnostics-local-receipt.json"
          test "$(wc -l < "$RUNNER_TEMP/observability-error-diagnostics-local-receipt.json")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/observability-error-diagnostics-local-receipt.json")" -le 32768

      - name: Create deployment candidate
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/observability-error-diagnostics-certification/project
        run: |
          mkdir -p "$RUNNER_TEMP/observability-error-diagnostics-certification"
          node apps/cli/dist/index.js create --profile app --name acme-app --display-name "Acme App" --directory "$CERTIFICATION_ROOT"

      - name: Verify deployment candidate before certification fixtures
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/observability-error-diagnostics-certification/project
        run: |
          umask 077
          node apps/cli/dist/index.js infer --directory "$CERTIFICATION_ROOT" > "$RUNNER_TEMP/observability-error-diagnostics-candidate-infer.json"
          node apps/cli/dist/index.js doctor --directory "$CERTIFICATION_ROOT" > "$RUNNER_TEMP/observability-error-diagnostics-candidate-doctor.json"
          node apps/cli/dist/index.js diff --directory "$CERTIFICATION_ROOT" > "$RUNNER_TEMP/observability-error-diagnostics-candidate-diff.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { validateObservabilityDeploymentCandidate } from "./scripts/certify-observability-error-diagnostics.mjs";
            import { requireAppRuntimeEvidence } from "./scripts/certify-app-local.mjs";
            import { verifyGeneratedProject } from "./scripts/verify-generated-skeletons.mjs";
            try {
              const read = (name) => JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/observability-error-diagnostics-candidate-${name}.json`, "utf8"));
              const candidate = validateObservabilityDeploymentCandidate({
                revision: process.env.GITHUB_SHA,
                infer: read("infer"), doctor: read("doctor"), diff: read("diff"),
                projectSource: readFileSync(`${process.env.CERTIFICATION_ROOT}/.egeria/project.yaml`, "utf8"),
                manifest: JSON.parse(readFileSync(`${process.env.CERTIFICATION_ROOT}/apps/web/package.json`, "utf8")),
              });
              const runtime = await verifyGeneratedProject(process.env.CERTIFICATION_ROOT, "app");
              requireAppRuntimeEvidence(runtime, "app");
              process.stdout.write(`${JSON.stringify({ ...candidate, pristineRuntime: { checks: runtime.checks, workerIntegration: runtime.workerIntegration } })}\n`);
            } catch {
              process.stderr.write("{\"ok\":false,\"code\":\"CERTIFICATION_CANDIDATE_INVALID\"}\n");
              process.exitCode = 1;
            }
          ' > "$RUNNER_TEMP/observability-error-diagnostics-candidate-receipt.json"
          test "$(wc -l < "$RUNNER_TEMP/observability-error-diagnostics-candidate-receipt.json")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/observability-error-diagnostics-candidate-receipt.json")" -le 32768
          rm -f "$RUNNER_TEMP/observability-error-diagnostics-candidate-infer.json" "$RUNNER_TEMP/observability-error-diagnostics-candidate-doctor.json" "$RUNNER_TEMP/observability-error-diagnostics-candidate-diff.json"

      - name: Add certification fixtures
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/observability-error-diagnostics-certification/project
        run: |
          mkdir -p "$CERTIFICATION_ROOT/apps/web/app/certification/diagnostics"
          mkdir -p "$CERTIFICATION_ROOT/apps/web/app/api/certification/diagnostics"
          cp tests/capability-certification/fixtures/observability-error-diagnostics/apps/web/app/certification/diagnostics/page.tsx "$CERTIFICATION_ROOT/apps/web/app/certification/diagnostics/page.tsx"
          cp tests/capability-certification/fixtures/observability-error-diagnostics/apps/web/app/api/certification/diagnostics/route.ts "$CERTIFICATION_ROOT/apps/web/app/api/certification/diagnostics/route.ts"
          cp tests/capability-certification/fixtures/observability-error-diagnostics/observability-error-diagnostics.spec.ts "$CERTIFICATION_ROOT/apps/web/tests/e2e/observability-error-diagnostics.spec.ts"

      - name: Prepare deployment candidate
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/observability-error-diagnostics-certification/project
        run: |
          pnpm --dir "$CERTIFICATION_ROOT" install --frozen-lockfile
          pnpm --dir "$CERTIFICATION_ROOT" run build:cloudflare
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" run test:integration:cloudflare
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { generatedFixtureContracts } from "./scripts/verify-generated-skeletons.mjs";
            import { inspectAppEffectBuild } from "./scripts/verify-app-transition-visuals.mjs";
            import { requireAppRuntimeEvidence } from "./scripts/certify-app-local.mjs";
            try {
              const root = process.env.CERTIFICATION_ROOT;
              const paths = [
                ...generatedFixtureContracts.find(({ identifier }) => identifier === "app").expectedFiles,
                "apps/web/app/certification/diagnostics/page.tsx",
                "apps/web/app/api/certification/diagnostics/route.ts",
              ];
              const files = paths.map(path => ({ path, content: readFileSync(`${root}/${path}`) }));
              const build = { fixture: "app", ...await inspectAppEffectBuild(root, files) };
              const workerIntegration = { executed: ["app"], skipped: [] };
              requireAppRuntimeEvidence({ workerIntegration, appBuildEvidence: [build] }, "app");
              const receiptPath = `${process.env.RUNNER_TEMP}/observability-error-diagnostics-candidate-receipt.json`;
              const candidate = JSON.parse(readFileSync(receiptPath, "utf8"));
              writeFileSync(receiptPath, `${JSON.stringify({ ...candidate, deploymentWorkerIntegration: workerIntegration, appBuildEvidence: [build], checks: [...candidate.checks, "overlaid-opennext-build", "overlaid-worker-integration", "overlaid-effect-build"] })}\n`, { mode: 0o600 });
            } catch {
              process.stderr.write("{\"ok\":false,\"code\":\"CERTIFICATION_DEPLOYMENT_BUILD_INVALID\"}\n");
              process.exitCode = 1;
            }
          '
          test "$(wc -l < "$RUNNER_TEMP/observability-error-diagnostics-candidate-receipt.json")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/observability-error-diagnostics-candidate-receipt.json")" -le 32768
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" run browser:install:ci

      - name: Deploy certification Worker
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/observability-error-diagnostics-certification/project
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" exec opennextjs-cloudflare deploy --name test-deploy

      - name: Install observability provider secrets
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/observability-error-diagnostics-certification/project
          SECRET_FILE: ${{ runner.temp }}/observability-error-diagnostics-provider-secrets.json
          DEPLOYMENTS_FILE: ${{ runner.temp }}/observability-error-diagnostics-cloudflare-deployments.json
          DEPLOYMENT_RECEIPT: ${{ runner.temp }}/observability-error-diagnostics-cloudflare-receipt.json
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_STACK_INGESTING_HOST: ${{ secrets.BETTER_STACK_INGESTING_HOST }}
          BETTER_STACK_SOURCE_TOKEN: ${{ secrets.BETTER_STACK_SOURCE_TOKEN }}
        run: |
          umask 077
          trap 'rm -f "$SECRET_FILE" "$DEPLOYMENTS_FILE"' EXIT
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const values = {
              BETTER_STACK_INGESTING_HOST: process.env.BETTER_STACK_INGESTING_HOST,
              BETTER_STACK_SOURCE_TOKEN: process.env.BETTER_STACK_SOURCE_TOKEN,
            };
            if (Object.values(values).some((value) => typeof value !== "string" || value.length === 0)) process.exit(1);
            writeFileSync(process.env.SECRET_FILE, JSON.stringify(values), {
              encoding: "utf8",
              flag: "wx",
              mode: 0o600,
            });
          '
          test "$(stat -c "%a" "$SECRET_FILE")" = "600"
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" exec wrangler secret bulk "$SECRET_FILE" --name test-deploy
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" exec wrangler deployments list --name test-deploy --json > "$DEPLOYMENTS_FILE"
          test "$(stat -c "%a" "$DEPLOYMENTS_FILE")" = "600"
          node scripts/create-cloudflare-deployment-receipt.mjs --input "$DEPLOYMENTS_FILE" --revision "$GITHUB_SHA" --worker test-deploy --version 0.3.0 > "$DEPLOYMENT_RECEIPT"
          test "$(wc -l < "$DEPLOYMENT_RECEIPT")" -eq 1
          test "$(wc -c < "$DEPLOYMENT_RECEIPT")" -le 1024
          test "$(stat -c "%a" "$DEPLOYMENT_RECEIPT")" = "600"

      - name: Wait for deployed diagnostics readiness
        env:
          OBSERVABILITY_DIAGNOSTICS_CERTIFICATION_URL: ${{ vars.DEPLOY_URL }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          DEPLOYMENT_RECEIPT: ${{ runner.temp }}/observability-error-diagnostics-cloudflare-receipt.json
        run: |
          umask 077
          node scripts/exercise-observability-error-diagnostics.mjs --wait-readiness --base-url "$OBSERVABILITY_DIAGNOSTICS_CERTIFICATION_URL" --revision "$EXPECTED_REVISION" --deployment-receipt "$DEPLOYMENT_RECEIPT" > "$RUNNER_TEMP/observability-error-diagnostics-readiness-receipt.json"
          test "$(wc -l < "$RUNNER_TEMP/observability-error-diagnostics-readiness-receipt.json")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/observability-error-diagnostics-readiness-receipt.json")" -le 2048
          test "$(stat -c "%a" "$RUNNER_TEMP/observability-error-diagnostics-readiness-receipt.json")" = "600"

      - name: Exercise deployed server diagnostics
        env:
          OBSERVABILITY_DIAGNOSTICS_CERTIFICATION_URL: ${{ vars.DEPLOY_URL }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          umask 077
          node scripts/exercise-observability-error-diagnostics.mjs --base-url "$OBSERVABILITY_DIAGNOSTICS_CERTIFICATION_URL" --revision "$EXPECTED_REVISION" > "$RUNNER_TEMP/observability-error-diagnostics-route-receipt.json"
          test "$(wc -l < "$RUNNER_TEMP/observability-error-diagnostics-route-receipt.json")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/observability-error-diagnostics-route-receipt.json")" -le 4096

      - name: Test deployed browser diagnostics
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/observability-error-diagnostics-certification/project
          PLAYWRIGHT_DEPLOYED_URL: ${{ vars.DEPLOY_URL }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          OBSERVABILITY_DIAGNOSTICS_BROWSER_RECEIPT_PATH: ${{ runner.temp }}/observability-error-diagnostics-browser-receipt.json
        run: |
          umask 077
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" exec playwright test --config playwright.deployed.config.ts --retries=0 tests/e2e/observability-error-diagnostics.spec.ts
          test "$(wc -l < "$OBSERVABILITY_DIAGNOSTICS_BROWSER_RECEIPT_PATH")" -eq 1
          test "$(wc -c < "$OBSERVABILITY_DIAGNOSTICS_BROWSER_RECEIPT_PATH")" -le 4096
          test "$(stat -c "%a" "$OBSERVABILITY_DIAGNOSTICS_BROWSER_RECEIPT_PATH")" = "600"

      - name: Reconcile bounded certification matrix
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          umask 077
          node scripts/exercise-observability-error-diagnostics.mjs --reconcile --route-receipt "$RUNNER_TEMP/observability-error-diagnostics-route-receipt.json" --browser-receipt "$RUNNER_TEMP/observability-error-diagnostics-browser-receipt.json" --revision "$EXPECTED_REVISION" > "$RUNNER_TEMP/observability-error-diagnostics-matrix-receipt.json"
          test "$(wc -l < "$RUNNER_TEMP/observability-error-diagnostics-matrix-receipt.json")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/observability-error-diagnostics-matrix-receipt.json")" -le 4096

      - name: Upload certification receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: observability-error-diagnostics-certification-receipts
          path: |
            ${{ runner.temp }}/observability-error-diagnostics-local-receipt.json
            ${{ runner.temp }}/observability-error-diagnostics-candidate-receipt.json
            ${{ runner.temp }}/observability-error-diagnostics-readiness-receipt.json
            ${{ runner.temp }}/observability-error-diagnostics-route-receipt.json
            ${{ runner.temp }}/observability-error-diagnostics-browser-receipt.json
            ${{ runner.temp }}/observability-error-diagnostics-matrix-receipt.json
            ${{ runner.temp }}/observability-error-diagnostics-cloudflare-receipt.json
          if-no-files-found: error
          retention-days: 7
