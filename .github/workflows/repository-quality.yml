name: Repository quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      generated-projects: ${{ steps.classify.outputs.generated-projects }}
      compatibility-proof: ${{ steps.classify.outputs.compatibility-proof }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify deep quality scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          generated_projects="true"
          compatibility_proof="true"
          scope_error="false"
          zero_revision="0000000000000000000000000000000000000000"
          BASE_SHA=""
          HEAD_SHA=""

          case "$EVENT_NAME" in
            pull_request)
              BASE_SHA="$PULL_REQUEST_BASE_SHA"
              HEAD_SHA="$PULL_REQUEST_HEAD_SHA"
              ;;
            push)
              BASE_SHA="$PUSH_BASE_SHA"
              HEAD_SHA="$PUSH_HEAD_SHA"
              ;;
            *)
              scope_error="true"
              ;;
          esac

          revision_shape_is_valid() {
            local revision="$1"
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$revision" != "$zero_revision" ]]
          }

          generated_paths=(
            ".github/workflows/**"
            ".gitattributes"
            ".npmrc"
            "package.json"
            "pnpm-lock.yaml"
            "pnpm-workspace.yaml"
            "apps/cli/**"
            "packages/builder-core/**"
            "packages/observability/**"
            "packages/standards/**"
            "fixtures/generated/**"
            "scripts/verify-generated-skeletons.mjs"
            "tests/generated-fixtures/**"
          )
          compatibility_paths=(
            ".github/workflows/**"
            ".npmrc"
            "package.json"
            "pnpm-lock.yaml"
            "pnpm-workspace.yaml"
            "packages/standards/**"
            "proofs/nextjs-cloudflare/**"
          )

          if [[ "$scope_error" == "false" ]] &&
            revision_shape_is_valid "$BASE_SHA" &&
            revision_shape_is_valid "$HEAD_SHA" &&
            git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
            git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            set +e
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "${generated_paths[@]}"
            generated_status=$?
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "${compatibility_paths[@]}"
            compatibility_status=$?
            set -e

            case "$generated_status" in
              0)
                generated_projects="false"
                ;;
              1)
                generated_projects="true"
                ;;
              *)
                scope_error="true"
                ;;
            esac

            case "$compatibility_status" in
              0)
                compatibility_proof="false"
                ;;
              1)
                compatibility_proof="true"
                ;;
              *)
                scope_error="true"
                ;;
            esac
          else
            scope_error="true"
          fi

          if [[ "$scope_error" == "true" ]]; then
            generated_projects="true"
            compatibility_proof="true"
          fi

          printf 'generated-projects=%s\n' "$generated_projects" >> "$GITHUB_OUTPUT"
          printf 'compatibility-proof=%s\n' "$compatibility_proof" >> "$GITHUB_OUTPUT"

  builder-and-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test repository constitution
        run: pnpm run test:constitution

      - name: Check semantic naming
        run: pnpm run check:semantic-naming

      - name: Test package boundaries
        run: pnpm run test:package-boundaries

      - name: Build builder and packages
        run: pnpm run build:builder

      - name: Test builder core
        run: pnpm run test:builder-core

      - name: Test CLI
        run: pnpm run test:cli

      - name: Test public packages
        run: pnpm run test:packages

      - name: Test capability certification contracts
        run: pnpm run test:capability-certification

      - name: Check capability admission
        run: pnpm run check:capability-certification

      - name: Lint builder and packages
        run: pnpm run lint:builder

      - name: Typecheck builder and packages
        run: pnpm run typecheck:builder

      - name: Check release intent
        run: pnpm exec changeset status --since origin/main

  generated-projects:
    needs: [scope]
    if: needs.scope.outputs.generated-projects == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production generator
        run: pnpm run build:builder

      - name: Test generated fixture contracts and determinism
        run: pnpm run test:generated-fixtures

      - name: Verify retained generated projects
        run: pnpm run verify:generated-skeletons

  compatibility-proof:
    needs: [scope]
    if: needs.scope.outputs.compatibility-proof == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint compatibility proof
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run lint

      - name: Typecheck compatibility proof
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run typecheck

      - name: Test compatibility proof unit behavior
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run test:unit

      - name: Build Next.js compatibility proof
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run build

      - name: Build OpenNext compatibility proof
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof exec opennextjs-cloudflare build --skipNextBuild

      - name: Check Cloudflare generated types
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run cf-typegen:check

      - name: Test Cloudflare harness integration
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run test:integration:cloudflare

      - name: Install Chromium
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof exec playwright install --with-deps chromium

      - name: Test development browser behavior
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run test:e2e:dev

      - name: Test OpenNext preview browser behavior
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run test:e2e:preview

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
