name: Repository quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      generated-projects: ${{ steps.classify.outputs.generated-projects }}
      compatibility-proof: ${{ steps.classify.outputs.compatibility-proof }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify deep quality scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          generated_projects="true"
          compatibility_proof="true"
          scope_error="false"
          zero_revision="0000000000000000000000000000000000000000"
          BASE_SHA=""
          HEAD_SHA=""

          case "$EVENT_NAME" in
            pull_request)
              BASE_SHA="$PULL_REQUEST_BASE_SHA"
              HEAD_SHA="$PULL_REQUEST_HEAD_SHA"
              ;;
            push)
              BASE_SHA="$PUSH_BASE_SHA"
              HEAD_SHA="$PUSH_HEAD_SHA"
              ;;
            *)
              scope_error="true"
              ;;
          esac

          revision_shape_is_valid() {
            local revision="$1"
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$revision" != "$zero_revision" ]]
          }

          generated_paths=(
            ".github/workflows/repository-quality.yml"
            ".gitattributes"
            ".npmrc"
            "package.json"
            "pnpm-lock.yaml"
            "pnpm-workspace.yaml"
            "apps/cli/**"
            "packages/builder-core/**"
            "packages/observability/**"
            "packages/standards/**"
            "fixtures/generated/**"
            "scripts/verify-generated-skeletons.mjs"
            "scripts/verify-app-transition-visuals.mjs"
            "scripts/lib/isolated-process.mjs"
            "scripts/lib/dependency-audit.mjs"
            "scripts/dependency-audit-exception.json"
            "tests/generated-fixtures/**"
          )
          compatibility_paths=(
            ".github/workflows/repository-quality.yml"
            ".npmrc"
            "package.json"
            "pnpm-lock.yaml"
            "pnpm-workspace.yaml"
            "packages/standards/**"
            "proofs/nextjs-cloudflare/**"
          )

          if [[ "$scope_error" == "false" ]] &&
            revision_shape_is_valid "$BASE_SHA" &&
            revision_shape_is_valid "$HEAD_SHA" &&
            git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
            git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            set +e
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "${generated_paths[@]}"
            generated_status=$?
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "${compatibility_paths[@]}"
            compatibility_status=$?
            set -e

            case "$generated_status" in
              0)
                generated_projects="false"
                ;;
              1)
                generated_projects="true"
                ;;
              *)
                scope_error="true"
                ;;
            esac

            case "$compatibility_status" in
              0)
                compatibility_proof="false"
                ;;
              1)
                compatibility_proof="true"
                ;;
              *)
                scope_error="true"
                ;;
            esac
          else
            scope_error="true"
          fi

          if [[ "$scope_error" == "true" ]]; then
            generated_projects="true"
            compatibility_proof="true"
          fi

          printf 'generated-projects=%s\n' "$generated_projects" >> "$GITHUB_OUTPUT"
          printf 'compatibility-proof=%s\n' "$compatibility_proof" >> "$GITHUB_OUTPUT"

  builder-and-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test repository constitution
        run: pnpm run test:constitution

      - name: Check semantic naming
        run: pnpm run check:semantic-naming

      - name: Test package boundaries
        run: pnpm run test:package-boundaries

      - name: Build builder and packages
        run: pnpm run build:builder

      - name: Test builder core
        run: pnpm run test:builder-core

      - name: Test CLI excluding dedicated lifecycle jobs
        env:
          CLI_TEST_SKIP_PATTERN: (?:^compiled current jobs lifecycle on portfolio completes production verification$)|(?:^compiled current jobs lifecycle on app-persistence-email completes production verification$)|(?:^compiled current app optional lifecycle completes production verification$)|(?:^compiled current email lifecycle on portfolio verifies and retains its foundation$)|(?:^compiled current email lifecycle on site verifies and retains its foundation$)|(?:^compiled current Web3Forms lifecycle on portfolio preserves composition and re-adds safely$)|(?:^compiled current Web3Forms lifecycle on app preserves composition and re-adds safely$)
        run: node --test --test-skip-pattern="$CLI_TEST_SKIP_PATTERN" apps/cli/tests/*.test.mjs

      - name: Test public packages
        run: pnpm run test:packages

      - name: Test capability certification contracts
        run: pnpm run test:capability-certification

      - name: Check capability admission
        run: pnpm run check:capability-certification

      - name: Lint builder and packages
        run: pnpm run lint:builder

      - name: Typecheck builder and packages
        run: pnpm run typecheck:builder

      - name: Check release intent
        run: pnpm run check:package-release dependency-update origin/main || pnpm run check:package-release pull-request origin/main || pnpm exec changeset status --since origin/main

  cli-jobs:
    name: CLI jobs (${{ matrix.fixture }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: portfolio
            test-pattern: ^compiled current jobs lifecycle on portfolio completes production verification$
          - fixture: app-persistence-email
            test-pattern: ^compiled current jobs lifecycle on app-persistence-email completes production verification$
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build builder and packages
        run: pnpm run build:builder

      - name: Test CLI jobs lifecycle
        env:
          CLI_TEST_PATTERN: ${{ matrix.test-pattern }}
        run: node --test --test-name-pattern="$CLI_TEST_PATTERN" apps/cli/tests/*.test.mjs

  cli-lifecycle:
    name: CLI lifecycle (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: app-optionals
            test-pattern: ^compiled current app optional lifecycle completes production verification$
          - group: email-portfolio
            test-pattern: ^compiled current email lifecycle on portfolio verifies and retains its foundation$
          - group: email-site
            test-pattern: ^compiled current email lifecycle on site verifies and retains its foundation$
          - group: hosted-contact-portfolio
            test-pattern: ^compiled current Web3Forms lifecycle on portfolio preserves composition and re-adds safely$
          - group: hosted-contact-app
            test-pattern: ^compiled current Web3Forms lifecycle on app preserves composition and re-adds safely$
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build builder and packages
        run: pnpm run build:builder

      - name: Test CLI lifecycle
        env:
          CLI_TEST_PATTERN: ${{ matrix.test-pattern }}
        run: node --test --test-name-pattern="$CLI_TEST_PATTERN" apps/cli/tests/*.test.mjs

  generated-projects:
    needs: [scope]
    if: needs.scope.outputs.generated-projects == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --shm-size=1g
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production generator
        run: pnpm run build:builder

      - name: Verify generated visual regressions
        run: pnpm run verify:generated-visuals

      - name: Retain raw dependency audits and security exception dispositions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-dependency-audits
          path: generated-visual-artifacts/dependency-audit/
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

      - name: Upload generated visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-visual-failure-artifacts
          path: generated-visual-artifacts/
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  generated-fixtures:
    needs: [scope]
    if: needs.scope.outputs.generated-projects == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --shm-size=1g
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Record native Git prerequisite outcomes
        id: git_prerequisite
        continue-on-error: true
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import * as filesystem from "node:fs";
          import path from "node:path";
          import { spawnSync } from "node:child_process";
          
          const maximumBytes = 1024 * 1024;
          const recordingErrors = [];
          const closedError = error => error ? {
            code: typeof error.code === "string" ? error.code : null,
            errno: typeof error.errno === "number" ? error.errno : null,
            syscall: typeof error.syscall === "string" ? error.syscall : null,
          } : null;
          
          try {
            const runnerTemporaryDirectory = filesystem.realpathSync(process.env.RUNNER_TEMP);
            const artifactDirectory = filesystem.mkdtempSync(path.join(runnerTemporaryDirectory, "git-prerequisite-"));
            filesystem.chmodSync(artifactDirectory, 0o700);
            filesystem.appendFileSync(process.env.GITHUB_OUTPUT, `directory=${artifactDirectory}\n`);
            const save = (name, bytes) => {
              try {
                filesystem.writeFileSync(path.join(artifactDirectory, name), bytes, { flag: "wx", mode: 0o600 });
                return true;
              } catch (error) {
                recordingErrors.push({ file: name, error: closedError(error) });
                return false;
              }
            };
            const json = value => `${JSON.stringify(value, null, 2)}\n`;
            const checkoutRoot = filesystem.realpathSync(process.cwd());
            const workspaceRoot = filesystem.realpathSync(process.env.GITHUB_WORKSPACE);
            if (checkoutRoot !== workspaceRoot) throw Object.assign(new Error(), { code: "CHECKOUT_WORKSPACE_MISMATCH" });
            const ownership = name => {
              try {
                const information = filesystem.lstatSync(name);
                return { uid: information.uid, gid: information.gid,
                  type: information.isSymbolicLink() ? "symlink" : information.isDirectory() ? "directory" : information.isFile() ? "file" : "other" };
              } catch (error) {
                return { error: closedError(error) };
              }
            };
            const inheritedCount = Number(process.env.GIT_CONFIG_COUNT ?? "0");
            const boundedCount = Number.isInteger(inheritedCount) && inheritedCount >= 0 && inheritedCount <= 32;
            const exactRootEntries = [];
            for (let index = 0; index < (boundedCount ? inheritedCount : 0); index += 1) {
              if (process.env[`GIT_CONFIG_KEY_${index}`] === "safe.directory" &&
                  process.env[`GIT_CONFIG_VALUE_${index}`] === checkoutRoot) {
                exactRootEntries.push({ origin: `environment:GIT_CONFIG_VALUE_${index}`, value: checkoutRoot });
              }
            }
            save("context.json", json({ cwd: process.cwd(), checkoutRoot, workspaceRoot,
              effectiveUid: process.geteuid(), effectiveGid: process.getegid(),
              checkoutOwnership: ownership(checkoutRoot), gitOwnership: ownership(path.join(checkoutRoot, ".git")),
              home: process.env.HOME ?? null,
              runtime: { node: process.version, platform: process.platform, architecture: process.arch },
              safeDirectoryObservation: { exactRootEntries, inheritedEntryInspectionComplete: boundedCount,
                fileConfigurationRead: false, completeConfigurationInventory: false },
            }));
          
            const environment = { ...process.env, GIT_OPTIONAL_LOCKS: "0" };
            const listingArguments = ["ls-files", "--cached", "--others", "--exclude-standard", "-z"];
            const outcomes = [];
            for (const [name, arguments_] of [["inherited", listingArguments],
              ["exact-root", ["-c", `safe.directory=${checkoutRoot}`, ...listingArguments]]]) {
              const started = Date.now();
              const result = spawnSync("git", arguments_, { cwd: checkoutRoot, env: environment,
                encoding: null, shell: false, timeout: 30000, killSignal: "SIGKILL", maxBuffer: maximumBytes });
              const stdout = result.stdout ?? Buffer.alloc(0);
              const stderr = result.stderr ?? Buffer.alloc(0);
              const stdoutPrefix = stdout.subarray(0, maximumBytes);
              const stderrPrefix = stderr.subarray(0, maximumBytes - stdoutPrefix.length);
              const stdoutSaved = save(`${name}.stdout`, stdoutPrefix);
              const stderrSaved = save(`${name}.stderr`, stderrPrefix);
              const outcome = { name, executable: "git", arguments: arguments_, cwd: checkoutRoot,
                optionalLocks: "0", nativeExit: result.status, signal: result.signal,
                processError: closedError(result.error), elapsedMilliseconds: Date.now() - started,
                stdout: { capturedBytes: stdout.length, savedBytes: stdoutSaved ? stdoutPrefix.length : null, saved: stdoutSaved },
                stderr: { capturedBytes: stderr.length, savedBytes: stderrSaved ? stderrPrefix.length : null, saved: stderrSaved },
                captureComplete: stdoutSaved && stderrSaved && !result.error && !result.signal &&
                  stdout.length + stderr.length <= maximumBytes,
              };
              const processMetadataSaved = save(`${name}.process.json`, json(outcome));
              outcomes.push({ ...outcome, processMetadataSaved });
            }
            const summarySaved = save("summary.json", json({ observationsOnly: true,
              timeoutMillisecondsPerChild: 30000, maximumBytesPerChild: maximumBytes, outcomes, recordingErrors }));
            const incomplete = !summarySaved || recordingErrors.length > 0 ||
              outcomes.some(outcome => !outcome.captureComplete || !outcome.processMetadataSaved || outcome.nativeExit !== 0);
            console.log(JSON.stringify({ diagnosticRecording: incomplete ? "native-failure-or-incomplete" : "recorded",
              outcomes: outcomes.map(({ name, nativeExit, signal, captureComplete }) => ({ name, nativeExit, signal, captureComplete })),
              recordingErrorCount: recordingErrors.length }));
            if (incomplete) process.exitCode = 1;
          } catch (error) {
            console.error(JSON.stringify({ diagnosticRecording: "failed", error: closedError(error) }));
            process.exitCode = 1;
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production generator
        run: pnpm run build:builder

      - name: Test generated fixture contracts and determinism
        run: pnpm run test:generated-fixtures

      - name: Retain native Git prerequisite evidence
        if: always() && steps.git_prerequisite.outputs.directory != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-fixtures-git-prerequisite
          path: |
            ${{ steps.git_prerequisite.outputs.directory }}/context.json
            ${{ steps.git_prerequisite.outputs.directory }}/inherited.stdout
            ${{ steps.git_prerequisite.outputs.directory }}/inherited.stderr
            ${{ steps.git_prerequisite.outputs.directory }}/inherited.process.json
            ${{ steps.git_prerequisite.outputs.directory }}/exact-root.stdout
            ${{ steps.git_prerequisite.outputs.directory }}/exact-root.stderr
            ${{ steps.git_prerequisite.outputs.directory }}/exact-root.process.json
            ${{ steps.git_prerequisite.outputs.directory }}/summary.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  generated-jobs:
    needs: [scope]
    if: needs.scope.outputs.generated-projects == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --shm-size=1g
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify fresh jobs runtime generation
        run: pnpm run test:generated-jobs

  app-transition-visuals:
    needs: [scope]
    if: needs.scope.outputs.generated-projects == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --shm-size=1g
    timeout-minutes: 45
    env:
      EGERIA_VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate draft app transition visual review candidates
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: pnpm run verify:app-transition-visuals -- --candidates --app-recipe-version=0.2.6

      - name: Compare all app transition visual subsets
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        run: pnpm run verify:app-transition-visuals -- --app-recipe-version=0.2.6

      - name: Retain raw dependency audits and security exception dispositions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-transition-dependency-audits
          path: generated-visual-artifacts/dependency-audit/
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

      - name: Upload app transition visual evidence
        if: failure() || (github.event_name == 'pull_request' && github.event.pull_request.draft)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-transition-visual-artifacts
          path: generated-visual-artifacts/app-transitions/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  compatibility-proof:
    needs: [scope]
    if: needs.scope.outputs.compatibility-proof == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint compatibility proof
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run lint

      - name: Typecheck compatibility proof
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run typecheck

      - name: Test compatibility proof unit behavior
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run test:unit

      - name: Build Next.js compatibility proof
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run build

      - name: Build OpenNext compatibility proof
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof exec opennextjs-cloudflare build --skipNextBuild

      - name: Check Cloudflare generated types
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run cf-typegen:check

      - name: Test Cloudflare harness integration
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run test:integration:cloudflare

      - name: Install Chromium
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof exec playwright install --with-deps chromium

      - name: Test development browser behavior
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run test:e2e:dev

      - name: Test OpenNext preview browser behavior
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof run test:e2e:preview

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
