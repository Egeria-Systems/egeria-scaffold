name: Production observability certification

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact main revision approved for certification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-deploy
  cancel-in-progress: false
  queue: max

jobs:
  verify-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: test-deploy
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: true
          install: false

      - name: Verify approved revision
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_REVISION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install builder dependencies
        run: pnpm install --frozen-lockfile

      - name: Check capability admission
        run: pnpm run check:capability-certification

      - name: Build builder packages
        run: pnpm run build:builder

      - name: Verify fresh local scaffold
        run: |
          node scripts/certify-production-observability.mjs > "$RUNNER_TEMP/production-observability-local-receipt.json"
          test "$(wc -l < "$RUNNER_TEMP/production-observability-local-receipt.json")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/production-observability-local-receipt.json")" -le 2048

      - name: Create deployment candidate
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/production-observability-certification/project
        run: |
          mkdir -p "$RUNNER_TEMP/production-observability-certification"
          node apps/cli/dist/index.js create --profile portfolio --name acme-portfolio-observability --display-name "Acme Portfolio Observability" --directory "$CERTIFICATION_ROOT"

      - name: Add certification fixtures
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/production-observability-certification/project
        run: |
          mkdir -p "$CERTIFICATION_ROOT/apps/web/app/api/observability-certification-error"
          cp tests/capability-certification/fixtures/observability-error-route.ts "$CERTIFICATION_ROOT/apps/web/app/api/observability-certification-error/route.ts"
          cp tests/capability-certification/fixtures/observability-browser-error.spec.ts "$CERTIFICATION_ROOT/apps/web/tests/e2e/observability-browser-error.spec.ts"

      - name: Prepare deployment candidate
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/production-observability-certification/project
        run: |
          pnpm --dir "$CERTIFICATION_ROOT" install --frozen-lockfile
          pnpm --dir "$CERTIFICATION_ROOT" run build:cloudflare
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" run browser:install:ci

      - name: Deploy certification Worker
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/production-observability-certification/project
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" exec opennextjs-cloudflare deploy --name test-deploy

      - name: Install observability provider secrets
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/production-observability-certification/project
          SECRET_FILE: ${{ runner.temp }}/production-observability-provider-secrets.json
          DEPLOYMENTS_FILE: ${{ runner.temp }}/production-observability-cloudflare-deployments.json
          DEPLOYMENT_RECEIPT: ${{ runner.temp }}/production-observability-cloudflare-receipt.json
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_STACK_INGESTING_HOST: ${{ secrets.BETTER_STACK_INGESTING_HOST }}
          BETTER_STACK_SOURCE_TOKEN: ${{ secrets.BETTER_STACK_SOURCE_TOKEN }}
        run: |
          umask 077
          trap 'rm -f "$SECRET_FILE" "$DEPLOYMENTS_FILE"' EXIT
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const values = {
              BETTER_STACK_INGESTING_HOST: process.env.BETTER_STACK_INGESTING_HOST,
              BETTER_STACK_SOURCE_TOKEN: process.env.BETTER_STACK_SOURCE_TOKEN,
            };
            if (Object.values(values).some((value) => typeof value !== "string" || value.length === 0)) process.exit(1);
            writeFileSync(process.env.SECRET_FILE, JSON.stringify(values), {
              encoding: "utf8",
              flag: "wx",
              mode: 0o600,
            });
          '
          test "$(stat -c "%a" "$SECRET_FILE")" = "600"
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" exec wrangler secret bulk "$SECRET_FILE" --name test-deploy
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" exec wrangler deployments list --name test-deploy --json > "$DEPLOYMENTS_FILE"
          test "$(stat -c "%a" "$DEPLOYMENTS_FILE")" = "600"
          node scripts/create-cloudflare-deployment-receipt.mjs --input "$DEPLOYMENTS_FILE" --revision "$GITHUB_SHA" --worker test-deploy > "$DEPLOYMENT_RECEIPT"
          test "$(wc -l < "$DEPLOYMENT_RECEIPT")" -eq 1
          test "$(wc -c < "$DEPLOYMENT_RECEIPT")" -le 1024
          test "$(stat -c "%a" "$DEPLOYMENT_RECEIPT")" = "600"

      - name: Exercise deployed observability
        env:
          OBSERVABILITY_CERTIFICATION_URL: ${{ vars.DEPLOY_URL }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          node scripts/exercise-production-observability.mjs --base-url "$OBSERVABILITY_CERTIFICATION_URL" --revision "$EXPECTED_REVISION" > "$RUNNER_TEMP/production-observability-route-receipt.json"
          test "$(wc -l < "$RUNNER_TEMP/production-observability-route-receipt.json")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/production-observability-route-receipt.json")" -le 2048

      - name: Test deployed application behavior
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/production-observability-certification/project
          PLAYWRIGHT_DEPLOYED_URL: ${{ vars.DEPLOY_URL }}
          OBSERVABILITY_BROWSER_RECEIPT_PATH: ${{ runner.temp }}/production-observability-browser-receipt.json
        run: |
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" run test:e2e:deployed
          test "$(wc -l < "$OBSERVABILITY_BROWSER_RECEIPT_PATH")" -eq 1
          test "$(wc -c < "$OBSERVABILITY_BROWSER_RECEIPT_PATH")" -le 1024
          test "$(stat -c "%a" "$OBSERVABILITY_BROWSER_RECEIPT_PATH")" = "600"

      - name: Upload certification receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-observability-certification-receipts
          path: |
            ${{ runner.temp }}/production-observability-local-receipt.json
            ${{ runner.temp }}/production-observability-route-receipt.json
            ${{ runner.temp }}/production-observability-browser-receipt.json
            ${{ runner.temp }}/production-observability-cloudflare-receipt.json
          if-no-files-found: error
          retention-days: 7
