name: Booking Calendly certification

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact main revision approved for certification
        required: true
        type: string
      calendly_url:
        description: Synthetic Calendly event URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-deploy
  cancel-in-progress: false
  queue: max

jobs:
  verify-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: test-deploy
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: true
          install: false

      - name: Verify approved revision
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_REVISION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install builder dependencies
        run: pnpm install --frozen-lockfile

      - name: Check capability admission
        run: pnpm run check:capability-certification

      - name: Build builder packages
        run: pnpm run build:builder

      - name: Verify fresh local scaffold
        env:
          CALENDLY_URL: ${{ inputs.calendly_url }}
        run: |
          test -n "$CALENDLY_URL"
          node scripts/certify-booking-calendly.mjs --calendly-url "$CALENDLY_URL" > "$RUNNER_TEMP/booking-calendly-local-receipt.json"
          test "$(wc -l < "$RUNNER_TEMP/booking-calendly-local-receipt.json")" -eq 1

      - name: Create deployment candidate
        env:
          CALENDLY_URL: ${{ inputs.calendly_url }}
          CERTIFICATION_ROOT: ${{ runner.temp }}/booking-calendly-certification/project
        run: |
          test -n "$CALENDLY_URL"
          mkdir -p "$RUNNER_TEMP/booking-calendly-certification"
          node apps/cli/dist/index.js create --profile portfolio --name acme-portfolio-calendly --display-name "Acme Portfolio Booking" --directory "$CERTIFICATION_ROOT" --calendly-url "$CALENDLY_URL" --calendly-mode popup

      - name: Install deployment candidate dependencies
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/booking-calendly-certification/project
        run: pnpm --dir "$CERTIFICATION_ROOT" install --frozen-lockfile

      - name: Test deployment candidate unit behavior
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/booking-calendly-certification/project
        run: pnpm --dir "$CERTIFICATION_ROOT/apps/web" run test:unit

      - name: Test deployment candidate component behavior
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/booking-calendly-certification/project
        run: pnpm --dir "$CERTIFICATION_ROOT/apps/web" run test:component

      - name: Build and prepare deployment candidate
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/booking-calendly-certification/project
        run: |
          pnpm --dir "$CERTIFICATION_ROOT" run build:cloudflare
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" run browser:install:ci

      - name: Deploy certification Worker
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/booking-calendly-certification/project
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" exec opennextjs-cloudflare deploy --name test-deploy

      - name: Test deployed application behavior
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/booking-calendly-certification/project
          PLAYWRIGHT_DEPLOYED_URL: ${{ vars.DEPLOY_URL }}
        run: |
          test -n "$PLAYWRIGHT_DEPLOYED_URL"
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" run test:e2e:deployed

      - name: Upload local certification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: booking-calendly-local-receipt
          path: ${{ runner.temp }}/booking-calendly-local-receipt.json
          if-no-files-found: error
          retention-days: 7
