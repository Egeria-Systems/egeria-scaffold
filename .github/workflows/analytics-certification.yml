name: Analytics certification

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed main revision approved for certification
        required: true
        type: string
      exercise_revision:
        description: Exact earlier exercise revision to clean up; required only for cleanup
        required: false
        type: string
      reuse_revision:
        description: Exact earlier exercise revision whose retained identities should be reused
        required: false
        type: string
      mode:
        description: Exercise or retain and disable the exact task resources
        required: true
        type: choice
        options: [exercise, cleanup]

permissions:
  actions: read
  contents: read

concurrency:
  group: analytics-certification
  cancel-in-progress: false
  queue: max

jobs:
  certify:
    if: github.repository == 'Egeria-Systems/egeria-scaffold' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: analytics-certification
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Validate trusted request
        env:
          CERTIFICATION_MODE: ${{ inputs.mode }}
        run: |
          test "$GITHUB_REPOSITORY" = "Egeria-Systems/egeria-scaffold"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          case "$CERTIFICATION_MODE" in
            exercise|cleanup) printf 'CERTIFICATION_MODE=%s\n' "$CERTIFICATION_MODE" >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac

      - name: Check out approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Verify checked out subject
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          EXERCISE_REVISION: ${{ inputs.exercise_revision }}
          REUSE_REVISION: ${{ inputs.reuse_revision }}
        run: |
          node scripts/verify-approved-revision.mjs
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { appendFileSync, readFileSync } from "node:fs";
            const registry = JSON.parse(readFileSync("certifications/capabilities.json", "utf8"));
            const analytics = registry.records.analytics.subject;
            if (analytics?.descriptorVersion !== "0.1.0") process.exit(1);
            if (analytics?.behaviorContractDigest !== "sha256:6c562317c6888a0c4a1b14bb2d7320f309b7c6ac3927a4b94cb3e9365ae01bba") process.exit(1);
            const reuseRevision = process.env.REUSE_REVISION ?? "";
            let exerciseRevision = process.env.GITHUB_SHA;
            let resourceRevision = reuseRevision;
            if (process.env.CERTIFICATION_MODE === "cleanup") {
              if (reuseRevision) process.exit(1);
              exerciseRevision = process.env.EXERCISE_REVISION;
              if (!/^[0-9a-f]{40}$/u.test(exerciseRevision ?? "")) process.exit(1);
              resourceRevision = exerciseRevision;
            } else if (process.env.CERTIFICATION_MODE !== "exercise" || process.env.EXERCISE_REVISION) process.exit(1);
            if (resourceRevision) {
              if (!/^[0-9a-f]{40}$/u.test(resourceRevision) || (reuseRevision && reuseRevision === process.env.GITHUB_SHA)) process.exit(1);
              try {
                execFileSync("git", ["merge-base", "--is-ancestor", resourceRevision, process.env.GITHUB_SHA], { stdio: "ignore" });
              } catch { process.exit(1); }
            }
            appendFileSync(process.env.GITHUB_ENV, `EXERCISE_REVISION=${exerciseRevision}\nREUSE_REVISION=${reuseRevision}\nRESOURCE_REVISION=${resourceRevision}\n`);
          '

      - name: Install and build trusted source
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:builder
          pnpm run check:capability-certification

      - name: Prepare private measurement context
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/analytics-certification-evidence
        run: |
          umask 077
          mkdir -p "$EVIDENCE_DIRECTORY"
          chmod 700 "$EVIDENCE_DIRECTORY"
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const target = new URL(process.env.DEPLOY_URL);
            const hostnamePattern = /^analytics-certification\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.workers\.dev$/u;
            if (!hostnamePattern.test(target.hostname) || target.href !== `https://${target.hostname}/`) process.exit(1);
            const context = {
              schemaVersion: "2.0.0",
              mode: process.env.CERTIFICATION_MODE,
              event: { name: process.env.GITHUB_EVENT_NAME },
              source: { repository: process.env.GITHUB_REPOSITORY, ref: process.env.GITHUB_REF, revision: process.env.GITHUB_SHA, expectedRevision: process.env.EXPECTED_REVISION, checkedOutRevision: process.env.GITHUB_SHA, exerciseRevision: process.env.EXERCISE_REVISION },
              subject: { identifier: "analytics", version: "0.1.0", behaviorContractDigest: "sha256:6c562317c6888a0c4a1b14bb2d7320f309b7c6ac3927a4b94cb3e9365ae01bba" },
              environment: "analytics-certification",
              resources: { worker: "analytics-certification", target: "dedicated-non-production-workers-dev", hostname: target.hostname, production: false },
            };
            writeFileSync(`${process.env.EVIDENCE_DIRECTORY}/context.json`, JSON.stringify(context), { mode: 0o600, flag: "wx" });
          '

      - name: Resolve exact exercise identity artifacts
        if: env.RESOURCE_REVISION != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXERCISE_REVISION: ${{ env.RESOURCE_REVISION }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          umask 077
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const headers = { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: "application/vnd.github+json" };
            const controlPlaneFetch = (input, init = {}) =>
              fetch(input, { ...init, signal: AbortSignal.timeout(10_000) });
            const resolveArtifact = async (kind) => {
              const name = `analytics-certification-${kind}-identity-${process.env.EXERCISE_REVISION}`;
              const endpoint = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/artifacts?name=${encodeURIComponent(name)}&per_page=100`;
              const response = await controlPlaneFetch(endpoint, { headers });
              const payload = await response.json();
              const matches = (payload?.artifacts ?? []).filter((artifact) => artifact.name === name && artifact.expired === false && artifact.workflow_run?.head_sha === process.env.EXERCISE_REVISION && artifact.workflow_run?.head_branch === "main");
              if (!response.ok || matches.length !== 1 || !Number.isSafeInteger(matches[0].id)) process.exit(1);
              return matches[0].id;
            };
            const siteId = await resolveArtifact("site");
            const workerId = await resolveArtifact("worker");
            appendFileSync(process.env.GITHUB_ENV, `SITE_IDENTITY_ARTIFACT_ID=${siteId}\nWORKER_IDENTITY_ARTIFACT_ID=${workerId}\n`, { mode: 0o600 });
          '

      - name: Download exact exercise identity artifacts
        if: env.RESOURCE_REVISION != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/analytics-certification-evidence
        run: |
          umask 077
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const artifact_ids = [
              ["site", process.env.SITE_IDENTITY_ARTIFACT_ID],
              ["worker", process.env.WORKER_IDENTITY_ARTIFACT_ID],
            ];
            const headers = { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: "application/vnd.github+json" };
            const controlPlaneFetch = (input, init = {}) =>
              fetch(input, { ...init, signal: AbortSignal.timeout(10_000) });
            for (const [kind, id] of artifact_ids) {
              if (!/^[1-9][0-9]*$/u.test(id ?? "")) process.exit(1);
              const response = await controlPlaneFetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/artifacts/${id}/zip`, { headers });
              if (!response.ok) process.exit(1);
              const contentLength = Number(response.headers.get("content-length"));
              if (!Number.isInteger(contentLength) || contentLength < 22 || contentLength > 65_536) process.exit(1);
              const archive = Buffer.from(await response.arrayBuffer());
              if (archive.byteLength !== contentLength || archive.byteLength > 65_536) process.exit(1);
              writeFileSync(`${process.env.EVIDENCE_DIRECTORY}/${kind}-identity.zip`, archive, { mode: 0o600, flag: "wx" });
            }
          '
          test "$(unzip -Z1 "$EVIDENCE_DIRECTORY/site-identity.zip")" = "site-identity.json"
          test "$(unzip -Z1 "$EVIDENCE_DIRECTORY/worker-identity.zip")" = "worker-identity.json"
          unzip -q "$EVIDENCE_DIRECTORY/site-identity.zip" -d "$EVIDENCE_DIRECTORY"
          unzip -q "$EVIDENCE_DIRECTORY/worker-identity.zip" -d "$EVIDENCE_DIRECTORY"
          rm -f "$EVIDENCE_DIRECTORY/site-identity.zip" "$EVIDENCE_DIRECTORY/worker-identity.zip"
          chmod 600 "$EVIDENCE_DIRECTORY/site-identity.json" "$EVIDENCE_DIRECTORY/worker-identity.json"

      - name: Prepare private identity envelopes
        if: env.CERTIFICATION_MODE == 'exercise'
        env:
          HEAD_SHA: ${{ github.sha }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/analytics-certification-evidence
        run: |
          umask 077
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { prepareAnalyticsCertificationReuse } from "./scripts/analytics-certification-provider-receipt.mjs";
            const target = new URL(process.env.DEPLOY_URL);
            if (!/^analytics-certification\.[a-z0-9-]+\.workers\.dev$/u.test(target.hostname) || target.href !== `https://${target.hostname}/`) process.exit(1);
            const shared = { headSha: process.env.HEAD_SHA, environment: "analytics-certification", hostname: target.hostname, identityKnown: false };
            let identities = { siteIdentity: { ...shared, site: null }, workerIdentity: { ...shared, worker: null } };
            if (process.env.REUSE_REVISION) {
              const read = (name) => JSON.parse(readFileSync(`${process.env.EVIDENCE_DIRECTORY}/${name}-identity.json`, "utf8"));
              identities = prepareAnalyticsCertificationReuse({ context: { headSha: process.env.REUSE_REVISION, environment: shared.environment, hostname: shared.hostname, worker: "analytics-certification" }, siteIdentity: read("site"), workerIdentity: read("worker"), headSha: process.env.HEAD_SHA });
            }
            const options = { mode: 0o600, flag: process.env.REUSE_REVISION ? "w" : "wx" };
            writeFileSync(`${process.env.EVIDENCE_DIRECTORY}/site-identity.json`, JSON.stringify(identities.siteIdentity), options);
            writeFileSync(`${process.env.EVIDENCE_DIRECTORY}/worker-identity.json`, JSON.stringify(identities.workerIdentity), options);
          '

      - name: Create and read back Web Analytics site
        if: env.CERTIFICATION_MODE == 'exercise'
        env:
          HEAD_SHA: ${{ github.sha }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/analytics-certification-evidence
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WEB_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_API_TOKEN }}
        run: |
          umask 077
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync, renameSync, writeFileSync } from "node:fs";
            import { planAnalyticsCertificationCleanup, readAnalyticsCertificationSite } from "./scripts/analytics-certification-provider-receipt.mjs";
            const target = new URL(process.env.DEPLOY_URL);
            if (!/^analytics-certification\.[a-z0-9-]+\.workers\.dev$/u.test(target.hostname) || target.href !== `https://${target.hostname}/`) process.exit(1);
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const credential = process.env.CLOUDFLARE_WEB_ANALYTICS_API_TOKEN;
            if (!account || !credential) process.exit(1);
            const endpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/rum/site_info`;
            const headers = { Authorization: `Bearer ${credential}`, "Content-Type": "application/json" };
            const controlPlaneFetch = (input, init = {}) =>
              fetch(input, { ...init, signal: AbortSignal.timeout(10_000) });
            const readIdentity = (kind) => JSON.parse(readFileSync(`${process.env.EVIDENCE_DIRECTORY}/${kind}-identity.json`, "utf8"));
            const previousIdentity = readIdentity("site");
            const existingSite = await readAnalyticsCertificationSite(controlPlaneFetch, endpoint, headers, target.hostname, process.env.REUSE_REVISION && previousIdentity.identityKnown === true ? previousIdentity.site.siteTag : null);
            let site;
            let createdByRun = false;
            if (process.env.REUSE_REVISION && previousIdentity.identityKnown === true) {
              if (existingSite === null) process.exit(1);
              site = existingSite;
              planAnalyticsCertificationCleanup({ context: { headSha: process.env.HEAD_SHA, environment: "analytics-certification", hostname: target.hostname, worker: "analytics-certification" }, siteIdentity: previousIdentity, workerIdentity: readIdentity("worker"), currentWorker: null, currentSite: { hostname: site.host, siteTag: site.site_tag, siteTokenSha256: createHash("sha256").update(site.site_token).digest("hex"), autoInstall: site.auto_install } });
            } else {
              if (existingSite !== null || previousIdentity.identityKnown !== false) process.exit(1);
              const createdResponse = await controlPlaneFetch(endpoint, { method: "POST", headers, body: JSON.stringify({ host: target.hostname, auto_install: false }) });
              const created = await createdResponse.json();
              site = created?.result;
              if (!createdResponse.ok || created?.success !== true || site?.auto_install !== false || site?.host !== target.hostname) process.exit(1);
              createdByRun = true;
            }
            if (typeof site.site_tag !== "string" || !/^[A-Za-z0-9_-]{8,128}$/u.test(site.site_tag) || typeof site.site_token !== "string" || site.site_token.length === 0) process.exit(1);
            const tokenDigest = createHash("sha256").update(site.site_token).digest("hex");
            const identity = { headSha: process.env.HEAD_SHA, environment: "analytics-certification", hostname: target.hostname, identityKnown: true, site: { siteTag: site.site_tag, siteTokenSha256: tokenDigest, autoInstall: false } };
            const identityPath = `${process.env.EVIDENCE_DIRECTORY}/site-identity.json`;
            writeFileSync(`${identityPath}.next`, JSON.stringify(identity), { mode: 0o600, flag: "wx" });
            renameSync(`${identityPath}.next`, identityPath);
            writeFileSync(`${process.env.RUNNER_TEMP}/analytics-certification-site-token`, site.site_token, { mode: 0o600, flag: "wx" });
            const readbackResponse = await controlPlaneFetch(`${endpoint}/${encodeURIComponent(site.site_tag)}`, { headers });
            const readback = await readbackResponse.json();
            const value = readback?.result;
            if (!readbackResponse.ok || readback?.success !== true || value?.site_tag !== site.site_tag || value?.site_token !== site.site_token || value?.auto_install !== false || value?.host !== target.hostname) process.exit(1);
            if (typeof value?.snippet !== "string" || !value.snippet.includes(site.site_token)) process.exit(1);
            const measurement = { schemaVersion: "2.0.0", headSha: process.env.HEAD_SHA, environment: "analytics-certification", hostname: target.hostname, createdByRun, reusedFromRevision: createdByRun ? null : process.env.REUSE_REVISION, readbackVerified: true, siteTagMatchesIdentity: value.site_tag === identity.site.siteTag, siteTokenMatchesIdentity: createHash("sha256").update(value.site_token).digest("hex") === identity.site.siteTokenSha256, scriptTokenMatchesIdentity: value.snippet.includes(site.site_token), autoInstall: value.auto_install };
            writeFileSync(`${process.env.EVIDENCE_DIRECTORY}/site-readback.json`, JSON.stringify(measurement), { mode: 0o600, flag: "wx" });
          '

      - name: Upload Web Analytics identity
        if: always() && env.CERTIFICATION_MODE == 'exercise'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analytics-certification-site-identity-${{ github.sha }}
          path: ${{ runner.temp }}/analytics-certification-evidence/site-identity.json
          if-no-files-found: error
          retention-days: 90

      - name: Generate exact analytics candidate
        if: env.CERTIFICATION_MODE == 'exercise'
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/analytics-certification/project
          GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          MICROSOFT_CLARITY_PROJECT_ID: ${{ vars.MICROSOFT_CLARITY_PROJECT_ID }}
          GOOGLE_SEARCH_CONSOLE_VERIFICATION_TOKEN: ${{ vars.GOOGLE_SEARCH_CONSOLE_VERIFICATION_TOKEN }}
        run: |
          test -n "$GOOGLE_ANALYTICS_MEASUREMENT_ID"
          test -n "$MICROSOFT_CLARITY_PROJECT_ID"
          test -n "$GOOGLE_SEARCH_CONSOLE_VERIFICATION_TOKEN"
          CLOUDFLARE_SITE_TOKEN="$(cat "$RUNNER_TEMP/analytics-certification-site-token")"
          test -n "$CLOUDFLARE_SITE_TOKEN"
          mkdir -p "$(dirname "$CERTIFICATION_ROOT")"
          node apps/cli/dist/index.js create --profile app --name analytics-certification --display-name "Analytics Certification" --directory "$CERTIFICATION_ROOT" --multilingual --cloudflare-web-analytics-token "$CLOUDFLARE_SITE_TOKEN" --google-analytics-id "$GOOGLE_ANALYTICS_MEASUREMENT_ID" --microsoft-clarity-id "$MICROSOFT_CLARITY_PROJECT_ID" --microsoft-clarity-audience not-directed-to-minors --search-console-verification "$GOOGLE_SEARCH_CONSOLE_VERIFICATION_TOKEN" --looker-studio

      - name: Verify and prepare analytics candidate
        if: env.CERTIFICATION_MODE == 'exercise'
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/analytics-certification/project
          GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          MICROSOFT_CLARITY_PROJECT_ID: ${{ vars.MICROSOFT_CLARITY_PROJECT_ID }}
          GOOGLE_SEARCH_CONSOLE_VERIFICATION_TOKEN: ${{ vars.GOOGLE_SEARCH_CONSOLE_VERIFICATION_TOKEN }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/analytics-certification-evidence
        run: |
          node apps/cli/dist/index.js infer --directory "$CERTIFICATION_ROOT" > "$RUNNER_TEMP/analytics-certification-infer.json"
          node apps/cli/dist/index.js doctor --directory "$CERTIFICATION_ROOT" > "$RUNNER_TEMP/analytics-certification-doctor.json"
          node apps/cli/dist/index.js diff --directory "$CERTIFICATION_ROOT" > "$RUNNER_TEMP/analytics-certification-diff.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { isDeepStrictEqual } from "node:util";
            const read = (name) => JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/analytics-certification-${name}.json`, "utf8"));
            const infer = read("infer");
            const doctor = read("doctor");
            const difference = read("diff");
            const state = infer.result?.state?.value;
            if (state?.origin?.profile !== "app" || state?.origin?.recipeVersion !== "0.2.0") process.exit(1);
            const installedCapabilities = state.installedCapabilities ?? [];
            if (!installedCapabilities.some(({ identifier, version }) => identifier === "app-foundation" && version === "0.1.0")) process.exit(1);
            if (infer.result?.state?.kind !== "valid" || !installedCapabilities.some(({ identifier, version }) => identifier === "analytics" && version === "0.1.0") || !installedCapabilities.some(({ identifier, version }) => identifier === "multilingual" && version === "0.1.0")) process.exit(1);
            if (doctor.result?.healthy !== true || doctor.result?.diagnostics?.length !== 0 || difference.result?.equal !== true || difference.result?.differences?.length !== 0) process.exit(1);
            const settingsPath = `${process.env.CERTIFICATION_ROOT}/apps/web/src/integrations/analytics/analytics-settings.ts`;
            const source = readFileSync(settingsPath, "utf8");
            const prefix = `import type { AnalyticsSettings } from "./analytics-provider-contract";\n\nexport const analyticsSettings = `;
            const suffix = " as const satisfies AnalyticsSettings;\n";
            if (!source.startsWith(prefix) || !source.endsWith(suffix)) process.exit(1);
            const expected = { consent: { policy: "explicit-opt-in" }, providers: { cloudflareWebAnalytics: { siteToken: readFileSync(`${process.env.RUNNER_TEMP}/analytics-certification-site-token`, "utf8") }, googleAnalytics4: { measurementId: process.env.GOOGLE_ANALYTICS_MEASUREMENT_ID }, microsoftClarity: { projectId: process.env.MICROSOFT_CLARITY_PROJECT_ID, audience: "not-directed-to-minors" } }, operationalIntegrations: { googleSearchConsole: { verificationToken: process.env.GOOGLE_SEARCH_CONSOLE_VERIFICATION_TOKEN }, lookerStudio: { connector: "google-analytics-4" } } };
            if (!isDeepStrictEqual(JSON.parse(source.slice(prefix.length, -suffix.length)), expected)) process.exit(1);
          '
          pnpm --dir "$CERTIFICATION_ROOT" install --frozen-lockfile
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" run test:unit
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" run test:component
          pnpm --dir "$CERTIFICATION_ROOT" run build:cloudflare
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" run test:integration:cloudflare
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { inspectAppEffectBuild } from "./scripts/verify-app-transition-visuals.mjs";
            import { requireAppRuntimeEvidence } from "./scripts/certify-app-local.mjs";
            try {
              const root = process.env.CERTIFICATION_ROOT;
              const state = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/analytics-certification-infer.json`, "utf8")).result.state.value;
              const files = [...new Set(state.managedSurfaces.map(({ path }) => path))].map(path => ({ path, content: readFileSync(`${root}/${path}`) }));
              const runtime = {
                workerIntegration: { executed: ["app-analytics"], skipped: [] },
                appBuildEvidence: [{ fixture: "app-analytics", ...await inspectAppEffectBuild(root, files) }],
              };
              requireAppRuntimeEvidence(runtime, "app-analytics");
              const measurement = { schemaVersion: "1.0.0", headSha: process.env.GITHUB_SHA, profile: state.origin.profile, recipeVersion: state.origin.recipeVersion, ...runtime };
              writeFileSync(`${process.env.EVIDENCE_DIRECTORY}/app-build.json`, JSON.stringify(measurement), { mode: 0o600, flag: "wx" });
            } catch {
              process.stderr.write("{\"ok\":false,\"code\":\"CERTIFICATION_DEPLOYMENT_BUILD_INVALID\"}\n");
              process.exitCode = 1;
            }
          '
          test "$(wc -c < "$EVIDENCE_DIRECTORY/app-build.json")" -le 32768
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" run browser:install:ci
          rm -f "$RUNNER_TEMP/analytics-certification-infer.json" "$RUNNER_TEMP/analytics-certification-doctor.json" "$RUNNER_TEMP/analytics-certification-diff.json"

      - name: Deploy dedicated certification Worker
        if: env.CERTIFICATION_MODE == 'exercise'
        env:
          HEAD_SHA: ${{ github.sha }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/analytics-certification-evidence
          CERTIFICATION_ROOT: ${{ runner.temp }}/analytics-certification/project
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_DEPLOY_API_TOKEN"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { planAnalyticsCertificationCleanup, readAnalyticsCertificationWorker } from "./scripts/analytics-certification-provider-receipt.mjs";
            const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/analytics-certification`;
            const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_DEPLOY_API_TOKEN}` };
            const controlPlaneFetch = (input, init = {}) =>
              fetch(input, { ...init, signal: AbortSignal.timeout(10_000) });
            const currentWorker = await readAnalyticsCertificationWorker(controlPlaneFetch, endpoint, headers);
            const read = (kind) => JSON.parse(readFileSync(`${process.env.EVIDENCE_DIRECTORY}/${kind}-identity.json`, "utf8"));
            const workerIdentity = read("worker");
            if (currentWorker === null) {
              if (workerIdentity.identityKnown !== false) process.exit(1);
            } else {
              if (!process.env.REUSE_REVISION) process.exit(1);
              const target = new URL(process.env.DEPLOY_URL);
              planAnalyticsCertificationCleanup({ context: { headSha: process.env.HEAD_SHA, environment: "analytics-certification", hostname: target.hostname, worker: "analytics-certification" }, siteIdentity: read("site"), workerIdentity, currentSite: null, currentWorker });
              const response = await controlPlaneFetch(`${endpoint}/subdomain`, { headers });
              const payload = await response.json();
              if (!response.ok || payload?.success !== true || payload.result?.enabled !== false || payload.result?.previews_enabled !== false) process.exit(1);
            }
          '
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_DEPLOY_API_TOKEN" pnpm --dir "$CERTIFICATION_ROOT/apps/web" exec opennextjs-cloudflare deploy --name analytics-certification

      - name: Read back dedicated Worker deployment
        if: env.CERTIFICATION_MODE == 'exercise'
        env:
          HEAD_SHA: ${{ github.sha }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/analytics-certification-evidence
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          umask 077
          node --input-type=module -e '
            import { renameSync, writeFileSync } from "node:fs";
            import { readAnalyticsCertificationWorker } from "./scripts/analytics-certification-provider-receipt.mjs";
            const target = new URL(process.env.DEPLOY_URL);
            if (!/^analytics-certification\.[a-z0-9-]+\.workers\.dev$/u.test(target.hostname) || target.href !== `https://${target.hostname}/`) process.exit(1);
            const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_DEPLOY_API_TOKEN}` };
            const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/analytics-certification`;
            const controlPlaneFetch = (input, init = {}) =>
              fetch(input, { ...init, signal: AbortSignal.timeout(10_000) });
            const worker = await readAnalyticsCertificationWorker(controlPlaneFetch, endpoint, headers);
            if (worker === null) process.exit(1);
            const { deploymentId, versionId } = worker;
            const identity = { headSha: process.env.HEAD_SHA, environment: "analytics-certification", hostname: target.hostname, identityKnown: true, worker: { name: "analytics-certification", deploymentId, versionId } };
            const identityPath = `${process.env.EVIDENCE_DIRECTORY}/worker-identity.json`;
            writeFileSync(`${identityPath}.next`, JSON.stringify(identity), { mode: 0o600, flag: "wx" });
            renameSync(`${identityPath}.next`, identityPath);
            const measurement = { schemaVersion: "1.0.0", headSha: process.env.HEAD_SHA, environment: "analytics-certification", hostname: target.hostname, worker: "analytics-certification", scriptReadbackVerified: true, deploymentReadbackVerified: true, deploymentId, versionId, singleVersionAt100Percent: true };
            writeFileSync(`${process.env.EVIDENCE_DIRECTORY}/deployment-readback.json`, JSON.stringify(measurement), { mode: 0o600, flag: "wx" });
          '

      - name: Upload Worker identity
        if: always() && env.CERTIFICATION_MODE == 'exercise'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analytics-certification-worker-identity-${{ github.sha }}
          path: ${{ runner.temp }}/analytics-certification-evidence/worker-identity.json
          if-no-files-found: error
          retention-days: 90

      - name: Wait for dedicated Worker readiness
        if: env.CERTIFICATION_MODE == 'exercise'
        env:
          HEAD_SHA: ${{ github.sha }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/analytics-certification-evidence
          MAXIMUM_ATTEMPTS: "20"
          INTERVAL_MILLISECONDS: "15000"
          REQUEST_TIMEOUT_MILLISECONDS: "5000"
          MAXIMUM_ELAPSED_MILLISECONDS: "300000"
        run: |
          umask 077
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { performance } from "node:perf_hooks";
            const target = new URL(process.env.DEPLOY_URL);
            if (!/^analytics-certification\.[a-z0-9-]+\.workers\.dev$/u.test(target.hostname) || target.href !== `https://${target.hostname}/`) process.exit(1);
            const readinessTarget = new URL("/en-CA", target);
            const maximumAttempts = Number(process.env.MAXIMUM_ATTEMPTS);
            const intervalMilliseconds = Number(process.env.INTERVAL_MILLISECONDS);
            const requestTimeoutMilliseconds = Number(process.env.REQUEST_TIMEOUT_MILLISECONDS);
            const maximumElapsedMilliseconds = Number(process.env.MAXIMUM_ELAPSED_MILLISECONDS);
            if (maximumAttempts !== 20 || intervalMilliseconds !== 15000 || requestTimeoutMilliseconds !== 5000 || maximumElapsedMilliseconds !== 300000) process.exit(1);
            const started = performance.now();
            let attempts = 0;
            let status = 0;
            let succeeded = false;
            while (attempts < maximumAttempts && performance.now() - started < maximumElapsedMilliseconds) {
              attempts += 1;
              const remaining = maximumElapsedMilliseconds - (performance.now() - started);
              try {
                const response = await fetch(readinessTarget, { headers: { "User-Agent": "egeria-analytics-certification-synthetic" }, redirect: "error", signal: AbortSignal.timeout(Math.max(1, Math.min(requestTimeoutMilliseconds, Math.floor(remaining)))) });
                status = response.status;
                if (response.ok) { succeeded = true; break; }
              } catch {
                status = 0;
              }
              const elapsed = performance.now() - started;
              if (attempts < maximumAttempts && elapsed < maximumElapsedMilliseconds) await new Promise((resolve) => setTimeout(resolve, Math.min(intervalMilliseconds, maximumElapsedMilliseconds - elapsed)));
            }
            const elapsedMilliseconds = Math.min(maximumElapsedMilliseconds, Math.ceil(performance.now() - started));
            if (!succeeded) process.exit(1);
            const measurement = { schemaVersion: "1.0.0", headSha: process.env.HEAD_SHA, hostname: target.hostname, maximumAttempts, intervalMilliseconds, requestTimeoutMilliseconds, maximumElapsedMilliseconds, attempts, elapsedMilliseconds, succeeded, status };
            writeFileSync(`${process.env.EVIDENCE_DIRECTORY}/readiness.json`, JSON.stringify(measurement), { mode: 0o600, flag: "wx" });
          '

      - name: Exercise deployed consent behavior
        if: env.CERTIFICATION_MODE == 'exercise'
        env:
          CERTIFICATION_ROOT: ${{ runner.temp }}/analytics-certification/project
          PLAYWRIGHT_DEPLOYED_URL: ${{ vars.DEPLOY_URL }}
          ANALYTICS_CERTIFICATION_TRAFFIC: synthetic-only
          ANALYTICS_PROVIDER_BROWSER_RECEIPT_PATH: ${{ runner.temp }}/analytics-certification-evidence/browser-journey.json
        run: |
          test "$ANALYTICS_CERTIFICATION_TRAFFIC" = "synthetic-only"
          cp tests/capability-certification/fixtures/analytics-provider/analytics-provider.spec.ts "$CERTIFICATION_ROOT/apps/web/tests/e2e/analytics-provider.spec.ts"
          pnpm --dir "$CERTIFICATION_ROOT/apps/web" exec playwright test --config playwright.deployed.config.ts --retries=0 tests/e2e/analytics-provider.spec.ts
          test "$(wc -l < "$ANALYTICS_PROVIDER_BROWSER_RECEIPT_PATH")" -eq 1
          test "$(wc -c < "$ANALYTICS_PROVIDER_BROWSER_RECEIPT_PATH")" -le 4096
          test "$(stat -c "%a" "$ANALYTICS_PROVIDER_BROWSER_RECEIPT_PATH")" = "600"

      - name: Retain and disable task resources
        if: env.CERTIFICATION_MODE == 'cleanup'
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/analytics-certification-evidence
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_WEB_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_API_TOKEN }}
        run: |
          umask 077
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync, writeFileSync } from "node:fs";
            import { planAnalyticsCertificationCleanup, readAnalyticsCertificationSite, readAnalyticsCertificationWorker } from "./scripts/analytics-certification-provider-receipt.mjs";
            const read = (name) => JSON.parse(readFileSync(`${process.env.EVIDENCE_DIRECTORY}/${name}.json`, "utf8"));
            const contextFile = read("context");
            const context = { headSha: contextFile.source.exerciseRevision, environment: contextFile.environment, hostname: contextFile.resources.hostname, worker: contextFile.resources.worker };
            const siteIdentity = read("site-identity");
            const workerIdentity = read("worker-identity");
            const target = new URL(process.env.DEPLOY_URL);
            if (target.href !== `https://${context.hostname}/`) process.exit(1);
            const analyticsHeaders = { Authorization: `Bearer ${process.env.CLOUDFLARE_WEB_ANALYTICS_API_TOKEN}` };
            const deployHeaders = { Authorization: `Bearer ${process.env.CLOUDFLARE_DEPLOY_API_TOKEN}` };
            const analyticsEndpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/rum/site_info`;
            const workerEndpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/analytics-certification`;
            const controlPlaneFetch = (input, init = {}) =>
              fetch(input, { ...init, signal: AbortSignal.timeout(10_000) });
            const readSite = async () => {
              const site = await readAnalyticsCertificationSite(controlPlaneFetch, analyticsEndpoint, analyticsHeaders, context.hostname, siteIdentity.identityKnown === true ? siteIdentity.site.siteTag : null);
              if (site === null) return null;
              return { hostname: site.host, siteTag: site.site_tag, siteTokenSha256: createHash("sha256").update(site.site_token).digest("hex"), autoInstall: site.auto_install };
            };
            const readWorker = () => readAnalyticsCertificationWorker(controlPlaneFetch, workerEndpoint, deployHeaders);
            const inspect = async () => planAnalyticsCertificationCleanup({ context, siteIdentity, workerIdentity, currentSite: await readSite(), currentWorker: await readWorker() });
            const plan = await inspect();
            if (plan.disableWorker) {
              const response = await controlPlaneFetch(`${workerEndpoint}/subdomain`, { method: "POST", headers: { ...deployHeaders, "Content-Type": "application/json" }, body: JSON.stringify({ enabled: false, previews_enabled: false }) });
              if (!response.ok || (await response.json())?.success !== true) process.exit(1);
            }
            // Reconcile unchanged identities after the mutation; absence is not retention.
            const after = await inspect();
            if (after.siteInitialState !== plan.siteInitialState || after.workerInitialState !== plan.workerInitialState) process.exit(1);
            let subdomain = null;
            if (plan.disableWorker) {
              const response = await controlPlaneFetch(`${workerEndpoint}/subdomain`, { headers: deployHeaders });
              const payload = await response.json();
              if (!response.ok || payload?.success !== true || payload.result?.enabled !== false || payload.result?.previews_enabled !== false) process.exit(1);
              subdomain = payload.result;
            }
            const resource = (initialState) => ({ initialState, identityDisposition: initialState === "present" ? "matched" : "not-present", disposition: initialState === "present" ? "retained" : "absent", verified: true });
            const measurement = { schemaVersion: "2.0.0", headSha: context.headSha, environment: context.environment, hostname: context.hostname, worker: context.worker, site: resource(plan.siteInitialState), workerResource: { ...resource(plan.workerInitialState), workersDevEnabled: subdomain?.enabled ?? null, previewsEnabled: subdomain?.previews_enabled ?? null }, dedicatedRecovery: "retained-with-workers-dev-disabled", operatorCleanupPending: true };
            writeFileSync(`${process.env.EVIDENCE_DIRECTORY}/cleanup.json`, JSON.stringify(measurement), { mode: 0o600, flag: "wx" });
          '

      - name: Build redacted receipt
        env:
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/analytics-certification-evidence
        run: |
          umask 077
          node scripts/analytics-certification-provider-receipt.mjs --input-directory "$EVIDENCE_DIRECTORY" > "$RUNNER_TEMP/analytics-certification-receipt.json"
          test "$(wc -l < "$RUNNER_TEMP/analytics-certification-receipt.json")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/analytics-certification-receipt.json")" -le 4096
          test "$(stat -c "%a" "$RUNNER_TEMP/analytics-certification-receipt.json")" = "600"
          rm -f "$RUNNER_TEMP/analytics-certification-site-token"

      - name: Upload app build evidence
        if: env.CERTIFICATION_MODE == 'exercise'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analytics-certification-app-build-${{ github.sha }}
          path: ${{ runner.temp }}/analytics-certification-evidence/app-build.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload redacted receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analytics-certification-${{ env.CERTIFICATION_MODE }}-receipt
          path: ${{ runner.temp }}/analytics-certification-receipt.json
          if-no-files-found: error
          retention-days: 7
