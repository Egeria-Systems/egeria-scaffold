name: Compatibility proof

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact main revision approved for deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-deploy
  cancel-in-progress: false
  queue: max

jobs:
  verify-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: test-deploy
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.20.0
          runtime: node@22.23.2
          cache: false
          install: false

      - name: Verify approved revision
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: node scripts/verify-approved-revision.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof exec playwright install --with-deps chromium

      - name: Verify compatibility proof
        run: pnpm run verify:compatibility-proof

      - name: Deploy compatibility Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          pnpm --filter @egeria-systems/nextjs-cloudflare-proof run deploy -- --name test-deploy

      - name: Test deployed compatibility proof
        env:
          COMPATIBILITY_URL: ${{ vars.DEPLOY_URL }}
        run: pnpm --filter @egeria-systems/nextjs-cloudflare-proof test:e2e:deployed
